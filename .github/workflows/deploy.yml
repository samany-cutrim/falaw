name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment
        run: |
          mkdir -p deploy
          cp -r html/Falaw/falaw.com.br/. deploy/
          cp -r assets deploy/
          # Corrige caminhos nas páginas raiz (../../../assets/ → assets/)
          find deploy -maxdepth 1 -name "*.html" -exec sed -i 's|\.\./\.\./\.\./assets/|assets/|g' {} \;
          # Corrige caminhos nas subpastas (../../../../assets/ → ../assets/)
          find deploy -mindepth 2 -name "*.html" -exec sed -i 's|\.\./\.\./\.\./\.\./assets/|../assets/|g' {} \;

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
