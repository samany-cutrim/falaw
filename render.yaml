# Render Blueprint — Falaw Advogados
# Este arquivo DEVE ficar na raiz do repositório para o Render detectá-lo.
# Todos os paths (dockerfilePath, dockerContext) são relativos à raiz do repo.
#
# Serviços:
#   1. falaw-pauta-sync      — cron: pauta de audiências Projuris ADV → Supabase
#   2. falaw-whatsapp-notify — cron: aviso WhatsApp 1 dia antes da audiência
#   3. falaw-evolution-api   — web:  Evolution API (WhatsApp Business)
#
# Obs: o serviço falaw-cockroach-api foi removido — o projeto passou a usar
# apenas o Supabase como banco/armazenamento.

services:
  # ── Cron: sincroniza pauta de audiências Projuris ADV → Supabase ──────────
  - type: cron
    name: falaw-pauta-sync
    runtime: docker
    dockerfilePath: ./pje-scraper/Dockerfile
    dockerContext: ./pje-scraper
    region: oregon
    # starter = 512 MB RAM. O login no Projuris usa Chromium headless;
    # se o job falhar por falta de memória (OOM), suba para "standard".
    plan: starter
    # 2x ao dia — BRT (UTC-3): 08:00 → 11:00 UTC | 16:00 → 19:00 UTC
    # (a execução da manhã cobre audiências marcadas na véspera após as 16h)
    schedule: "0 11,19 * * *"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # ── Cron: notificações WhatsApp — 1 dia antes da audiência ────────────────
  # BRT (UTC-3): 08:00 → 11:00 UTC
  - type: cron
    name: falaw-whatsapp-notify
    runtime: docker
    dockerfilePath: ./pje-scraper/Dockerfile
    dockerContext: ./pje-scraper
    region: oregon
    plan: starter
    schedule: "0 11 * * *"
    dockerCommand: python whatsapp_notify.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE
        value: falaw

  # ── Evolution API — WhatsApp Business ─────────────────────────────────────
  # Imagem fixada na v1.8.2: a linha v1.x aceita rodar SEM banco de dados
  # (DATABASE_ENABLED=false). A v2.x exige Postgres e ignora essas variáveis.
  # O disco persistente guarda a sessão do WhatsApp entre deploys
  # (sem ele, seria preciso escanear o QR code a cada deploy).
  # Requer plano pago: o plano free do Render não suporta discos.
  - type: web
    name: falaw-evolution-api
    runtime: docker
    dockerfilePath: ./cockroach-api/evolution-api/Dockerfile
    dockerContext: ./cockroach-api/evolution-api
    region: oregon
    plan: starter
    envVars:
      - key: AUTHENTICATION_API_KEY
        sync: false
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: DATABASE_ENABLED
        value: "false"
      - key: STORE_MESSAGES
        value: "false"
      - key: STORE_MESSAGE_UP
        value: "false"
      - key: STORE_CONTACTS
        value: "false"
      - key: STORE_CHATS
        value: "false"
      - key: DEL_INSTANCE
        value: "false"
      - key: LOG_LEVEL
        value: "ERROR,WARN,INFO"
    disk:
      name: evolution-data
      mountPath: /evolution/instances
      sizeGB: 1
