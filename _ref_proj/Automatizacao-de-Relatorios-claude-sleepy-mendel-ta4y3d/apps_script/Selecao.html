<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { padding: 16px; background: #f8f9fa; }

    h2 { font-size: 15px; color: #1a1a2e; margin-bottom: 4px; }
    p  { font-size: 12px; color: #666; margin-bottom: 12px; }

    .lista {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
    }

    .item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #f0f4ff; }
    .item input[type=checkbox] { margin-right: 10px; width: 16px; height: 16px; cursor: pointer; }
    .item label { font-size: 13px; color: #333; cursor: pointer; flex: 1; }
    .item .pasta { font-size: 11px; color: #999; margin-top: 2px; }

    .acoes {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: #1a73e8; color: #fff; flex: 1; }
    .btn-primary:hover { background: #1557b0; }
    .btn-secondary { background: #e8eaed; color: #444; }
    .btn-secondary:hover { background: #d0d3d8; }

    .sel-todos { font-size: 12px; color: #1a73e8; cursor: pointer; text-decoration: underline; margin-left: auto; }

    #status { font-size: 12px; color: #555; margin-top: 8px; display: none; }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc;
               border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vazio { padding: 20px; text-align: center; color: #999; font-size: 13px; }
  </style>
</head>
<body>

<h2>📋 Selecione os relatórios</h2>
<p>Marque os arquivos que deseja atualizar com o Projuris.</p>

<div id="lista" class="lista">
  <div class="vazio">⏳ Carregando arquivos...</div>
</div>

<div class="acoes">
  <button class="btn btn-secondary" onclick="google.script.host.close()">Cancelar</button>
  <span class="sel-todos" onclick="toggleTodos()">Selecionar todos</span>
  <button class="btn btn-primary" onclick="atualizar()">🔄 Atualizar selecionados</button>
</div>

<div id="status"></div>

<script>
  var arquivos = [];
  var todosSelecionados = false;

  // Carrega a lista de arquivos do servidor
  google.script.run
    .withSuccessHandler(renderLista)
    .withFailureHandler(function(e) {
      document.getElementById('lista').innerHTML =
        '<div class="vazio">❌ Erro ao carregar: ' + e.message + '</div>';
    })
    .listarArquivosParaSelecao();

  function renderLista(dados) {
    arquivos = dados;
    var lista = document.getElementById('lista');

    if (!dados || dados.length === 0) {
      lista.innerHTML = '<div class="vazio">Nenhum relatório encontrado na pasta.</div>';
      return;
    }

    lista.innerHTML = dados.map(function(f, i) {
      return '<div class="item" onclick="toggleCheck(' + i + ')">' +
        '<input type="checkbox" id="chk' + i + '" onclick="event.stopPropagation();atualizarBotao()">' +
        '<div><label for="chk' + i + '">' + f.nome + '</label>' +
        '<div class="pasta">📁 ' + f.pasta + '</div></div>' +
        '</div>';
    }).join('');
  }

  function toggleCheck(i) {
    var chk = document.getElementById('chk' + i);
    chk.checked = !chk.checked;
    atualizarBotao();
  }

  function toggleTodos() {
    todosSelecionados = !todosSelecionados;
    document.querySelectorAll('input[type=checkbox]').forEach(function(c) {
      c.checked = todosSelecionados;
    });
    document.querySelector('.sel-todos').textContent =
      todosSelecionados ? 'Desmarcar todos' : 'Selecionar todos';
    atualizarBotao();
  }

  function atualizarBotao() {
    var qtd = document.querySelectorAll('input[type=checkbox]:checked').length;
    document.querySelector('.btn-primary').textContent =
      qtd > 0 ? '🔄 Atualizar ' + qtd + ' selecionado(s)' : '🔄 Atualizar selecionados';
  }

  function atualizar() {
    var selecionados = [];
    document.querySelectorAll('input[type=checkbox]:checked').forEach(function(chk, _) {
      var idx = parseInt(chk.id.replace('chk', ''));
      selecionados.push(arquivos[idx].id);
    });

    if (selecionados.length === 0) {
      alert('Selecione ao menos um relatório.');
      return;
    }

    // Desativa botões e mostra progresso
    document.querySelectorAll('.btn, .sel-todos').forEach(function(b) { b.style.pointerEvents = 'none'; b.style.opacity = '0.5'; });
    var st = document.getElementById('status');
    st.style.display = 'block';
    st.innerHTML = '<span class="spinner"></span> Atualizando ' + selecionados.length + ' arquivo(s)... isso pode levar alguns minutos.';

    google.script.run
      .withSuccessHandler(function(resultado) {
        google.script.host.close();
        // O resultado é exibido pelo servidor via alert nativo
      })
      .withFailureHandler(function(e) {
        st.innerHTML = '❌ Erro: ' + e.message;
        document.querySelectorAll('.btn, .sel-todos').forEach(function(b) { b.style.pointerEvents = ''; b.style.opacity = ''; });
      })
      .atualizarSelecionados(selecionados);
  }
</script>
</body>
</html>
