<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Falaw Sync PJe</title>
<style>
  body { font-family: system-ui, sans-serif; width: 260px; padding: 16px; color: #1f2937; }
  h3   { font-size: 13px; font-weight: 700; color: #0D2B5E; margin: 0 0 12px }
  .btn { width: 100%; padding: 10px; background: #0D2B5E; color: #fde68a; border: none;
         border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 10px; font-size: 12px; color: #6b7280; min-height: 18px; }
  .ok  { color: #1B7A4E; }
  .err { color: #C62828; }
</style>
</head>
<body>
<h3>📅 Falaw — Sync PJe</h3>
<button class="btn" id="btn">Sincronizar agora</button>
<div id="status">Pronto.</div>
<script>
const btn = document.getElementById('btn');
const st  = document.getElementById('status');

btn.addEventListener('click', () => {
  btn.disabled = true;
  st.textContent = 'Iniciando…';
  st.className = '';
  chrome.runtime.sendMessage({ type: 'FALAW_START_SYNC' }, (r) => {
    if (!r?.ok) { st.textContent = r?.msg || 'Erro.'; st.className = 'err'; btn.disabled = false; }
  });
});

chrome.runtime.onMessage.addListener((msg) => {
  if (msg.type === 'FALAW_SYNC_PROGRESS') {
    st.textContent = msg.state.status + ` (${msg.state.done}/${msg.state.total})`;
  }
  if (msg.type === 'FALAW_SYNC_DONE') {
    st.textContent = `✓ ${msg.state.audiencias} audiências • ${msg.state.cancelados} canceladas detectadas`;
    st.className = 'ok';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
